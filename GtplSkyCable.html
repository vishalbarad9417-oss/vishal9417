<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTPL Account Manager</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
:root{
  --glass-bg:rgba(255,255,255,.65);
  --glass-border:rgba(255,255,255,.35);

  --blue:#0a84ff;
  --cyan:#64d2ff;
  --purple:#5e5ce6;

  --highlight:rgba(10,132,255,.2);
}

*{box-sizing:border-box;}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI";
  background:linear-gradient(135deg,#dbeafe,#eef2ff,#f5f3ff);
  perspective:1200px;
}

/* GLASS CARD */
.container{
  width:95%;
  max-width:430px;
  padding:22px;
  border-radius:28px;
  background:var(--glass-bg);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border:1px solid var(--glass-border);
  box-shadow:0 30px 60px rgba(0,0,0,.28),
             inset 0 0 25px rgba(255,255,255,.6);
  transform-style:preserve-3d;
  transition:.15s ease;
  overflow:hidden;
  position:relative;
}

/* TITLE */
h2{
  text-align:center;
  margin:5px 0 15px;
  font-weight:700;
  color:#1f2937;
}

/* MENU */
.menu{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
.menu button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:18px;
  font-weight:600;
  color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  box-shadow:0 8px 18px rgba(0,0,0,.25);
  transition:.2s;
}
.menu button.active{
  background:linear-gradient(135deg,var(--purple),var(--blue));
}
.menu button:active{
  transform:scale(.92);
}

/* SECTIONS */
.section{display:none;margin-top:12px;}
.section.active{display:block;}

/* INPUT */
input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:16px;
  border:none;
  font-size:16px;
  background:rgba(255,255,255,.85);
}

/* ACTION BUTTON */
.action{
  width:100%;
  padding:13px;
  border:none;
  border-radius:16px;
  background:linear-gradient(135deg,var(--purple),var(--blue));
  color:#fff;
  font-weight:600;
  margin-top:6px;
  box-shadow:0 10px 20px rgba(0,0,0,.3);
}
.action:active{transform:scale(.95);}

/* LIST */
ul{
  list-style:none;
  padding:0;
  max-height:260px;
  overflow:auto;
}
li{
  padding:14px;
  margin:8px 0;
  border-radius:20px;
  background:rgba(255,255,255,.75);
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 10px 22px rgba(0,0,0,.18);
  animation:fadeUp .3s ease;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:none;}
}

/* COPY */
.copy{
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  border:none;
  border-radius:12px;
  padding:7px 12px;
  color:#fff;
}
.copy::before{content:"📋";}

/* SEARCH HIGHLIGHT */
.hl{
  background:var(--highlight);
  color:var(--blue);
  padding:2px 6px;
  border-radius:8px;
  font-weight:600;
}

/* MOBILE */
@media(max-width:480px){
  .container{padding:18px;}
  input{font-size:15px;}
}
</style>
</head>

<body>

<div class="container" id="card">
<h2>GTPL Accounts</h2>

<div class="menu">
  <button class="active" onclick="tab('search',this)">Search</button>
  <button onclick="tab('add',this)">Add</button>
  <button onclick="tab('excel',this)">Excel</button>
  <button onclick="window.open('https://gtplsaathi.com','_blank')">GTPL</button>
</div>

<!-- SEARCH -->
<div id="search" class="section active">
  <input id="searchBox" placeholder="Search name or account">
  <ul id="list"></ul>
</div>

<!-- ADD -->
<div id="add" class="section">
  <input id="name" placeholder="Name">
  <input id="acc" placeholder="Account Number">
  <button class="action" onclick="add()">Add Account</button>
</div>

<!-- EXCEL -->
<div id="excel" class="section">
  <input type="file" id="excelFile" accept=".xlsx,.xls">
  <button class="action" onclick="exportExcel()">Export Excel</button>
</div>
</div>

<script>
let data=JSON.parse(localStorage.getItem("gtpl")||"[]");

/* TAB */
function tab(id,btn){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".menu button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}

/* ADD */
function add(){
  var name = document.getElementById('name');
  var acc = document.getElementById('acc');

  if(!name.value||!acc.value)return alert("Fill all");
  data.push({name:name.value,account:acc.value});
  save();
  name.value=acc.value="";
}

/* ESCAPE */
function esc(t){return t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}

/* SHOW */
function show(q=""){
  list.innerHTML="";
  let m=[],r=[];
  data.forEach(d=>{
    let result = `${d.name}${d.account}`;
    result.toLowerCase().includes(q)?m.push(d):r.push(d)
  });
  [...m,...r].forEach(d=>{
    let n=d.name,a=d.account?.toString();
    if(q){
      let reg=new RegExp(esc(q),"gi");
      n = n.replace(reg, match => `<span class='hl'>${match}</span>`);
      a = a.replace(reg, match => `<span class='hl'>${match}</span>`);
    }
    list.innerHTML+=`
      <li>
        <span>${n} - ${a}</span>
        <button class="copy" data-copy="${a}">Copy</button>
      </li>`;
  });
}

searchBox.oninput=e=>show(e.target.value.toLowerCase());

function save(){
  localStorage.setItem("gtpl",JSON.stringify(data));
  show(searchBox.value.toLowerCase());
}

/* EXCEL IMPORT */
excelFile.onchange=e=>{
  let r=new FileReader();
  r.onload=ev=>{
    let wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
    let js=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
    data=data.concat(js);
    save();
  };
  r.readAsArrayBuffer(e.target.files[0]);
};

/* EXPORT */
function exportExcel(){
  let ws=XLSX.utils.json_to_sheet(data);
  let wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"GTPL");
  XLSX.writeFile(wb,"gtpl_accounts.xlsx");
}

show();

/* 4D TILT (DESKTOP ONLY) */
if(window.innerWidth>768){
  document.addEventListener("mousemove",e=>{
    let x=(window.innerWidth/2-e.clientX)/20;
    let y=(window.innerHeight/2-e.clientY)/20;
    card.style.transform=`rotateY(${x}deg) rotateX(${y}deg)`;
  });
  document.addEventListener("mouseleave",()=>{
    card.style.transform="rotateX(0) rotateY(0)";
  });
}

document.addEventListener("click", function (e) {
  if (e.target.classList.contains("copy")) {
    const text = e.target.dataset.copy;

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }
});

function fallbackCopy(text) {
  const textarea = document.createElement("textarea");
  textarea.value = text;
  textarea.style.position = "fixed";
  document.body.appendChild(textarea);
  textarea.focus();
  textarea.select();
  document.execCommand("copy");
  document.body.removeChild(textarea);
}

</script>

</body>
</html>
